name: HIOS Sprint 1 Placeholder Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sprint-1-baseline:
    name: Sprint 1 baseline files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required Sprint 1 files
        shell: bash
        run: |
          test -f CONTRIBUTING.md
          test -f docs/architecture/ADR_TEMPLATE.md
          test -f docs/architecture/system-context.md
          test -f docs/architecture/service-boundaries.md
          test -f docs/api/openapi.yaml
          test -f docs/data/data-model-baseline.md
          test -f docs/qa/acceptance-gates.md

      - name: Report baseline status
        run: echo "HIOS Sprint 1 baseline files are present."
