name: HIOS Runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    name: Runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hios
          POSTGRES_PASSWORD: hios-ci-only
          POSTGRES_DB: hios_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hios -d hios_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hios:hios-ci-only@localhost:5432/hios_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-test-results
          path: test-results.xml
