openapi: 3.0.3
info:
  title: HIOS API
  version: 0.1.0
servers:
  - url: https://api.example.hios.local/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /plants:
    get:
      summary: List plants
      responses:
        '200':
          description: Plant list
  /plants/{plantId}:
    get:
      summary: Get plant
      parameters:
        - in: path
          name: plantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plant details
  /plants/{plantId}/forecast:
    get:
      summary: Get plant forecast
      parameters:
        - in: path
          name: plantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Forecast series
